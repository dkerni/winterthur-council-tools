name: GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Deployments werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests ausführen
        run: npm test

      - name: Daten validieren
        run: node scripts/validate-members.mjs

      - name: Website zusammenstellen
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html impressum.html .nojekyll _site/
          cp -r assets data media tools _site/

      - name: Zugangsschutz anwenden
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node scripts/protect-site.mjs --dir=_site

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
