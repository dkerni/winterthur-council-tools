name: Update member data

on:
  schedule:
    # Every Monday at 04:17 UTC (outside the peak hours of the source site).
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-members
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape member data
        run: npm run scrape

      # Warnings (e.g. a missing profession on the source site) are reported but
      # must not fail the run — only schema and consistency errors do.
      - name: Validate data
        run: node scripts/validate-members.mjs --expect-members=60

      - name: Run tests
        run: npm test

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes in data/members.json."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/members.json
          fi

      # A pull request would be preferable, but GitHub Actions is not permitted
      # to create pull requests in this repository ("GitHub Actions is not
      # permitted to create or approve pull requests"). The change is therefore
      # committed directly — validation and tests above gate it.
      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/members.json
          git commit -m 'Update member data'
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Redeploy website
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pushes made with the GITHUB_TOKEN do not trigger workflows, so the
          # Pages deployment is started explicitly.
          gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
